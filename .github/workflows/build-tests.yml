# This workflow performs test builds across a diversity of supported platforms
#
#     - ubuntu-latest  - gcc
#     - ubuntu-latest  - clang
#     - ubuntu-24.04   - gcc   (For backwards compatablity)
#     - windows-2022   - cl    (build on windows-latest is currently broken - Qt-6.2.4 MSVC incompatability)
#     - macos-latest   - clang, qt-6.10 (Bump to 6.10 to workaround linker errors on macos-latest)
#     - ubuntu-latest  - clang, qt-6.10 (For comparison to macos, only difference is OS)
#     - ubuntu-20.04   - gcc-10, qt-6.5 in a container (oldest supported Linux; same
#                        image the release packages are built in)
#
      

name: Multi-Platform Build Tests

on:
  push:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            qt_version: '6.2.*'
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            qt_version: '6.2.*'
          - os: ubuntu-22.04
            c_compiler: gcc
            cpp_compiler: g++
            qt_version: '6.2.*'
          - os: windows-2022
            c_compiler: cl
            cpp_compiler: cl
            qt_version: '6.2.*'
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            qt_version: '6.10.*'
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            qt_version: '6.10.*'

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        # Checkout full-depth to facilitate auto versioning
        fetch-depth: 0

    - name: Install optional dependencies (Ubuntu)
      if: startsWith( matrix.os, 'ubuntu-' )
      shell: bash
      run: |
        # install packages
        sudo apt-get update
        sudo apt-get -y install xvfb
        sudo apt-get -y install pkgconf libqrencode-dev
        sudo apt-get -y install barcode
        # install zint-2.15.0 from source
        wget https://downloads.sourceforge.net/project/zint/zint/2.15.0/zint-2.15.0-src.tar.gz && tar xzf zint-2.15.0-src.tar.gz && ( cd zint-2.15.0-src && mkdir build && cd build && cmake .. && make && sudo make install )

    - name: Pre-install vcpkg (Windows)
      if: startsWith( matrix.os, 'windows-' )
      shell: bash
      run: |
        git clone --depth 1 https://github.com/microsoft/vcpkg.git

    - name: Restore vcpkg cache (Windows)
      if: startsWith(matrix.os, 'windows-')
      uses: actions/cache@v6
      with:
        path: |
          ${{ github.workspace }}/vcpkg/installed
          ${{ github.workspace }}/vcpkg/downloads
        key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/workflows/build-tests.yml') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-

    - name: Install optional dependencies (Windows)
      if: startsWith( matrix.os, 'windows-' )
      shell: bash
      run: |
        # install packages
        ./vcpkg/bootstrap-vcpkg.sh
        ./vcpkg/vcpkg install pkgconf
        ./vcpkg/vcpkg install zlib
        ./vcpkg/vcpkg install libqrencode
        ./vcpkg/vcpkg install zint
        echo "TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV

    - name: Install optional dependencies (MacOS)
      if: startsWith( matrix.os, 'macos-' )
      shell: bash
      run: |
        # install packages
        brew install zlib
        brew install qrencode
        brew install zint

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ matrix.qt_version }}
        install-deps: 'true'
# FIX ME:  determine dependencies that work across all platforms for a smaller footprint.  These no longer work on MacOS.
#        archives: 'qtbase qtsvg qttools icu qttranslations qtwayland'

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "qt_version=$(basename $(dirname "$QT_ROOT_DIR"))" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_TOOLCHAIN_FILE=${{ env.TOOLCHAIN_FILE }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

    - name: Test (Ubuntu)
      if: startsWith( matrix.os, 'ubuntu-' )
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: |
        xvfb-run -a ./glabels/glabels-qt --Version
        xvfb-run -a ctest --build-config Release

    - name: Test (Windows)
      if: startsWith( matrix.os, 'windows-' )
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      env:
        QT_ASSUME_STDERR_HAS_CONSOLE: 1
      run: |
        ./glabels-batch/Release/glabels-batch-qt --Version
        ctest --build-config Release

    - name: Test (MacOS)
      if: startsWith( matrix.os, 'macos-' )
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: |
        ./glabels/glabels-qt --Version
        ctest --build-config Release --output-on-failure


#    - name: Tmate
#      uses: mxschmitt/action-tmate@v3
#      if: failure()


  ubuntu-2004:
    # GitHub no longer offers Ubuntu 20.04 runners, so build in a 20.04 container
    name: build (ubuntu-20.04 container, g++-10, 6.5.3)
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build the Ubuntu 20.04 image
      run: docker build -t glabels-plus-build:ubuntu20.04 packaging/ubuntu-20.04

    - name: Build and test
      run: |
        docker run --rm -v "$PWD:/src" -w /src glabels-plus-build:ubuntu20.04 bash -ec '
          git config --global --add safe.directory /src
          cmake -S . -B /tmp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_DIR"
          cmake --build /tmp/build -j"$(nproc)"
          cd /tmp/build && QT_QPA_PLATFORM=offscreen ctest --output-on-failure
        '
