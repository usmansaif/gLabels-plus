<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="16" y1="16" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#6a3de8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="16" x2="0" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="16" y1="16" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#6a3de8"/>
    </linearGradient>
    <linearGradient id="badge" x1="146" y1="146" x2="222" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc247"/>
      <stop offset="1" stop-color="#ff6b3d"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="16" y="20" width="224" height="224" rx="56" fill="#2a1a7a" fill-opacity="0.22"/>
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#bg)"/>
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#gloss)"/>

  <!-- label sheet -->
  <rect x="62" y="54" width="124" height="160" rx="16" fill="#1c0f5c" fill-opacity="0.28"/>
  <rect x="58" y="46" width="124" height="160" rx="16" fill="#ffffff"/>

  <!-- labels -->
  <rect x="72"  y="60"  width="43" height="36" rx="8" fill="url(#accent)"/>
  <rect x="80"  y="71"  width="27" height="5"  rx="2.5" fill="#ffffff"/>
  <rect x="80"  y="81"  width="18" height="5"  rx="2.5" fill="#ffffff" fill-opacity="0.7"/>
  <rect x="125" y="60"  width="43" height="36" rx="8" fill="#e3e8ff"/>
  <rect x="72"  y="108" width="43" height="36" rx="8" fill="#e3e8ff"/>
  <rect x="125" y="108" width="43" height="36" rx="8" fill="#e3e8ff"/>
  <rect x="72"  y="156" width="43" height="36" rx="8" fill="#e3e8ff"/>
  <rect x="125" y="156" width="43" height="36" rx="8" fill="#e3e8ff"/>

  <!-- plus badge -->
  <circle cx="186" cy="190" r="44" fill="#1c0f5c" fill-opacity="0.25"/>
  <circle cx="184" cy="184" r="44" fill="#ffffff"/>
  <circle cx="184" cy="184" r="36" fill="url(#badge)"/>
  <rect x="164" y="178" width="40" height="12" rx="6" fill="#ffffff"/>
  <rect x="178" y="164" width="12" height="40" rx="6" fill="#ffffff"/>
</svg>
