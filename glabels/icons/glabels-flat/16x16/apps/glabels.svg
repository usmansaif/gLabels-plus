  <rect x="0" y="0" width="16" height="16" rx="3.5" fill="url(#bg)"/>

  <rect x="3" y="2" width="8" height="11" rx="1" fill="#ffffff"/>
  <rect x="4" y="3" width="3" height="2" fill="url(#accent)"/>
  <rect x="8" y="3" width="2" height="2" fill="#c9d2ff"/>
  <rect x="4" y="6" width="3" height="2" fill="#c9d2ff"/>
  <rect x="8" y="6" width="2" height="2" fill="#c9d2ff"/>
  <rect x="4" y="9" width="3" height="2" fill="#c9d2ff"/>

  <circle cx="11.5" cy="11.5" r="4" fill="#ffffff"/>
  <circle cx="11.5" cy="11.5" r="3" fill="url(#badge)"/>
  <rect x="10" y="11" width="3" height="1" fill="#ffffff"/>
  <rect x="11" y="10" width="1" height="3" fill="#ffffff"/>
